services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      FOCAL_APP_ENV: development
      FOCAL_DB_HOST: db
      FOCAL_DB_PORT: 3306
      FOCAL_DB_NAME: focal_shift
      FOCAL_DB_USER: focal_user
      FOCAL_DB_PASS: focal_password
    volumes:
      - focal_uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: focal_shift
      MYSQL_USER: focal_user
      MYSQL_PASSWORD: focal_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - focal_database:/var/lib/mysql
      - ./database/focal_shift.sql:/docker-entrypoint-initdb.d/01-focal-shift.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  focal_database:
  focal_uploads:
